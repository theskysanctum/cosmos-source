; Launcher main menu, in display order - each section is one menu entry.
; The section name IS the displayed label. Recognized keys:
;   screen  = switch to this built-in app.py screen (categories/usb/
;             settings/filemanager/...) instead of launching anything
;   command = comma-separated argv to run (a list, not a single path -
;             watch for literal commas inside an argument, which this
;             simple split doesn't escape)
;   mode    = graphical | plain (default) - see graphical.py
;   action  = quit - exits the launcher instead of running anything
;   utility = true - moves this entry's icon out of Dashboard's own
;             top-right row into the shared bottom-right utility
;             cluster instead (Settings, File Manager, ...) - everything
;             lives on the one Dashboard screen now (no more separate
;             Games/Entertainment home screens - see app.py's
;             HOME_SCREEN_NAMES comment), so this is the only remaining
;             way to separate "main dashboard content" from "system
;             utility" icons
;   requires_module = <module id> - hides this entry entirely unless
;             that module is currently installed (see
;             packaging/module_registry.py) - the same idea as
;             library/systems.json's own requires_command guard, just
;             gated on an optional feature module instead of a host
;             command

[Games]
screen = categories

[Game Disc]
screen = disc

[Play Together]
; Host or join a co-op streaming session (Sunshine host + moonlight-
; embedded client - see streaming/sunshine_manager.py and
; streaming/moonlight_manager.py's own docstrings for why this exists
; instead of per-emulator netplay) - its own top-level entry, not
; tucked into Settings, per direct instruction.
screen = play_together

[Storage]
screen = usb
utility = true

[Settings]
screen = settings
utility = true

[File Manager]
screen = filemanager
utility = true

[Video]
; CosmOS's own native video app - not a Flatpak, not a foreign app's
; own window (Kodi and Stremio were both tried and dropped - see git
; history/the plan file). media/vlc_player.py embeds libVLC directly
; into this app's own GTK window; media/addons/video/ is CosmOS's own
; simple add-on format, with a built-in Local Files add-on scanning
; media_backend.py's movies_dir()/tv_dir().
screen = video_categories

[Music]
; Same native app-layer as Video (media/vlc_player.py, media/addons/
; music/) - a separate top-level menu entry per direct instruction, not
; nested under Video.
screen = music_categories

[Photos]
; media/photo_viewer.py - a plain image viewer, no playback engine
; needed. media/addons/photos/ for its own add-on format.
screen = photos_categories

[Switch Profile]
screen = profile_picker
utility = true

[Power]
; Logout/Restart/Shutdown - see App.build_power_page()/handle_power_action()
; in launcher/app.py. Its own top-level entry, not nested under Settings -
; a system power action is common enough to earn its own button.
screen = power
utility = true

[Shop]
screen = shop
