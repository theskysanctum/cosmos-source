[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita
gtk-icon-theme-name=Papirus
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-font-name=Rajdhani Medium 10
# No window buttons in app header bars: windows have no title bars in CosmOS (cosmos-wm
# maximizes everything; Alt+X closes), so the min/max/close a libadwaita/GTK header bar
# would add have nothing to act on. The header bar itself stays - it holds the app's controls.
gtk-decoration-layout=
