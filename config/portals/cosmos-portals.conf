# xdg-desktop-portal backends for the CosmOS session (XDG_CURRENT_DESKTOP=CosmOS):
# settings etc. from the GTK portal; file choosers from cosmos-portal-filechooser (the scoped
# file dialog - only your files, USB and other drives, see cosmos_portal_filechooser.py); screen capture and screenshots
# from the wlroots one, which uses the compositor's wlr-screencopy support.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=cosmos
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
