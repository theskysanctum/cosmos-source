# CosmOS remote access: SSH by key only, for the desktop account only.
# No passwords (a guessable password on an open port is how machines get taken), no root login.
# Keys are added on the machine itself from Settings > Remote Access (cosmos-remote), or in config/ssh/authorized_keys
# before a build.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AllowUsers user
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 60
ClientAliveCountMax 5
# Lets you reach the Webtop (only listens on this machine, port 3000) through your SSH connection: ssh -L 3000:localhost:3000 user@host
AllowTcpForwarding yes
X11Forwarding no
