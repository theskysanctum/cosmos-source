input_driver = "udev"
input_device = "CosmOS Pad 1"
input_device_display_name = "CosmOS Pad 1"

# CosmOS's own fixed virtual gamepad (see input/inputd.py's
# make_virtual_gamepads()/VIRTUAL_PAD_CAPS) - every emulator this
# project pre-configures binds to this exact, always-present device
# once, regardless of what real controller a user actually owns. This
# button/axis index mapping was NOT guessed - confirmed empirically by
# creating a real "CosmOS Pad N" UInput device with this project's
# own exact capability list and reading back its real evdev capability
# enumeration order (the kernel reports capabilities in ascending
# numeric code order, not UInput declaration order - a real, confirmed
# distinction: BTN_WEST/308 sorts after BTN_NORTH/307 despite being
# declared first).

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
