# Applied to every RetroArch launch via --appendconfig (see systems.json's
# RetroArch launch_templates). The pause menu (~/os/pause/) is meant to be
# the only way to exit an emulator - RetroArch's own quit hotkey has no
# gamepad binding by default, but this makes that guaranteed rather than
# incidental, in case a keyboard is ever attached or a future RetroArch
# version changes its defaults.
input_exit_emulator = "nul"
input_exit_emulator_axis = "nul"
input_exit_emulator_btn = "nul"
input_exit_emulator_mbtn = "nul"

# RetroArch defaults to a small windowed mode (confirmed live: a fresh
# config with this unset opens ~752x575 on a 1920x1080 display, with the
# rest of the real screen showing whatever was behind it) - never
# actually verified end-to-end before now, since this is the first real
# game+filter launch tested against a real display this project has
# done. A console appliance should never show anything but the game.
video_fullscreen = true
