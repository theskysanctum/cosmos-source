# The login screen's own GTK theme, so its card matches the desktop (greetd's account has its own home).
d /var/lib/greetd/.config 0755 greetd greetd -
d /var/lib/greetd/.config/gtk-3.0 0755 greetd greetd -
C /var/lib/greetd/.config/gtk-3.0/settings.ini 0644 greetd greetd - /etc/skel/.config/gtk-3.0/settings.ini
C /var/lib/greetd/.config/gtk-3.0/gtk.css 0644 greetd greetd - /etc/skel/.config/gtk-3.0/gtk.css
